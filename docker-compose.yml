services:
    postgres:
        image: postgres:18-alpine
        container_name: euro-haus-postgres
        restart: unless-stopped
        env_file:
            - .env
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql
            - ./migrations:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U eurohaus -d eurohaus"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres-data:
